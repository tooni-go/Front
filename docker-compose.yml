services:
  db:
    image: postgres:15-alpine
    container_name: evalia-postgres
    restart: always
    environment:
      POSTGRES_USER: evalia_user
      POSTGRES_PASSWORD: evalia_password
      POSTGRES_DB: evalia_db
    ports:
      - "5433:5432" # Expuesto en el 5433 para evitar conflictos en tu máquina
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - evalia-network

  backend:
    build:
      context: ../Backend-App
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://evalia_user:evalia_password@db:5432/evalia_db
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      - db
    networks:
      - evalia-network
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXTAUTH_URL=http://localhost:3001
    depends_on:
      - backend
    networks:
      - evalia-network
    restart: always

volumes:
  postgres-data:
  backend-uploads:

networks:
  evalia-network:
    driver: bridge
